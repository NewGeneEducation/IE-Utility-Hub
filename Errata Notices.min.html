<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Errata Register - TGBIE</title><style>@page{size:A4 landscape;margin:8mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:15px;background-color:#eef2f5;color:#000}.no-print{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:25px}.manual-input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:#f1f8e9;padding:15px;border-radius:6px;border:1px solid #c8e6c9;margin-bottom:18px}.input-group{display:flex;flex-direction:column;text-align:left}.input-group label{font-size:11.5px;font-weight:700;color:#2e7d32;margin-bottom:4px}.input-group input,.input-group select{padding:6px 8px;font-size:12px;border:1px solid #a5d6a7;border-radius:4px;outline:0;background:#fff}.input-group input:focus,.input-group select:focus{border-color:#2e7d32;box-shadow:0 0 3px rgba(46,125,50,.3)}.controls-section{margin-top:15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}.btn{border:none;padding:10px 18px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;transition:opacity .2s;color:#fff}.btn:hover{opacity:.9}.btn-date{background-color:#0277bd}.btn-print{background-color:#2e7d32}.sheet-container{background:#fff;padding:20px;margin-bottom:25px;border-radius:4px;box-shadow:0 0 10px rgba(0,0,0,.08);page-break-after:always;display:flex;flex-direction:column}.sheet-container:last-child{page-break-after:auto}.top-branding-bar{display:flex;justify-content:flex-end;align-items:center;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:10px;font-size:10px}.header-datetime{font-size:10px;color:#333;font-weight:600}.details-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;margin-bottom:12px;font-size:11px;font-weight:700}table{width:100%;border-collapse:collapse!important;border:1.5px solid #000!important;background-color:#fff;margin-bottom:15px;font-size:11px;table-layout:fixed;flex-grow:1}td,th{border:1px solid #000!important;padding:6px 4px;text-align:center;vertical-align:middle;color:#000;word-wrap:break-word;overflow-wrap:break-word;height:auto}.banner-exam{font-size:14px;font-weight:700;padding:6px;background-color:#fff!important;text-transform:uppercase}.banner-title{font-size:18px;font-weight:700;padding:8px;background-color:#fff!important;letter-spacing:.5px}.col-header th{font-size:12px;font-weight:700;background-color:#f9f9f9!important;padding:8px 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.data-row{height:auto}.data-row td{padding:8px 6px;min-height:24px}.footer-signatures{margin-top:25px;display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;font-weight:700}.footer-signatures div{text-align:center;flex:1}@media print{body{background-color:transparent;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none!important}.sheet-container{box-shadow:none;padding:0;margin:0;min-height:calc(100vh - 16mm)}table{border:1.5px solid #000!important}td,th{border:1px solid #000!important}}</style></head><body><div class=no-print><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0d47a1;padding-bottom:6px;margin-bottom:12px"><h3 style=margin:0;color:#0d47a1>NewGen eEducation : TGBIE &mdash; Errata Register Generator</h3><span id=live-clock style=font-size:12px;font-weight:700;color:#444></span></div><p style=font-size:12px;color:#555;margin-bottom:15px>Generate the official <strong>ERRATA Register</strong> to document question paper corrections, session details, and invigilator room acknowledgments.</p><div class=manual-input-grid><div class=input-group><label for=man-exam-type>Exam Type</label><select id=man-exam-type><option value=IPE>IPE (Annual)</option><option value=IPASE>IPASE (Advanced Supplementary)</option></select></div><div class=input-group><label for=man-exam-month-year>Exam Month &amp; Year</label><input id=man-exam-month-year placeholder="e.g., MARCH 2026"></div><div class=input-group><label for=man-centre-code>Centre Code</label><input id=man-centre-code placeholder="e.g., 44***"></div><div class=input-group><label for=man-college-name>Centre Name / College</label><input id=man-college-name placeholder="e.g., Govt. Junior College, _____"></div><div class=input-group><label for=man-dist-name>District</label><input id=man-dist-name placeholder="e.g., Bhadradri Kothagudem"></div><div class=input-group><label for=man-row-count>Number of Rows</label><input type=number id=man-row-count min=1 max=25 value=5></div></div><div class=controls-section><button class="btn btn-date" onclick=generateErrataRegister()>Generate Errata Register</button><button class="btn btn-print" onclick=window.print()>Print Register</button></div></div><div id=output-container></div><script>function updateClock(){const e=(new Date).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"medium"}),t=document.getElementById("live-clock");t&&(t.innerText=e)}function getFormattedTimestamp(){const e=new Date;return`${e.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})} | ${e.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:!0})}`}function getMetaInputs(){const e=document.getElementById("man-exam-type").value.trim(),t=document.getElementById("man-exam-month-year").value.trim(),n=document.getElementById("man-centre-code").value.trim(),o=document.getElementById("man-college-name").value.trim(),r=document.getElementById("man-dist-name").value.trim(),d=parseInt(document.getElementById("man-row-count").value,10)||10;return{exam:`${e} ${t}`.trim(),centreCode:n||"______",collegeName:o||"________________________________________________",dist:r||"________________",rowCount:d,timestamp:getFormattedTimestamp()}}function renderRegisterHtml(e){let t="";for(let n=1;n<=e.rowCount;n++)t+=`\n            <tr class="data-row">\n                <td>${n}</td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n            </tr>`;return`\n        <div class="sheet-container">\n            <div class="top-branding-bar">\n                <div class="header-datetime"><strong>Generated on:</strong> ${e.timestamp}</div>\n            </div>\n\n            <div class="details-grid">\n                <div><strong>Centre Code:</strong> ${e.centreCode}</div>\n                <div><strong>District:</strong> ${e.dist}</div>\n                <div><strong>Centre Name:</strong> ${e.collegeName}</div>\n            </div>\n\n            <table>\n                <colgroup>\n                    <col style="width: 6%;">\n                    <col style="width: 12%;">\n                    <col style="width: 12%;">\n                    <col style="width: 50%;">\n                    <col style="width: 20%;">\n                </colgroup>\n                <thead>\n                    <tr>\n                        <th colspan="5" class="banner-exam">${e.exam.toUpperCase()}</th>\n                    </tr>\n                    <tr>\n                        <th colspan="5" class="banner-title">ERRATA Register</th>\n                    </tr>\n                    <tr class="col-header">\n                        <th>SL no</th>\n                        <th>Day / Date</th>\n                        <th>Sub</th>\n                        <th>Type of ERRATA (error)</th>\n                        <th>Signature of Invigilator<br>with Room NO</th>\n                    </tr>\n                </thead>\n                <tbody>\n                    ${t}\n                </tbody>\n            </table>\n\n            <div class="footer-signatures">\n                <div>Signature of the Departmental Officer (D.O.)</div>\n                <div>Signature of the Additional Chief Superintendent</div>\n                <div>Signature of the Chief Superintendent (C.S.)</div>\n            </div>\n        </div>`}function generateErrataRegister(){const e=getMetaInputs();document.getElementById("output-container").innerHTML=renderRegisterHtml(e)}document.addEventListener("contextmenu",(e=>e.preventDefault())),document.addEventListener("keydown",(function(e){return"F12"===e.key||123===e.keyCode?(e.preventDefault(),!1):(!e.ctrlKey&&!e.metaKey||"u"!==e.key&&"U"!==e.key&&85!==e.keyCode)&&(!e.ctrlKey&&!e.metaKey||!e.shiftKey||"i"!==e.key&&"I"!==e.key&&73!==e.keyCode)&&(!e.ctrlKey&&!e.metaKey||!e.shiftKey||"j"!==e.key&&"J"!==e.key&&74!==e.keyCode)&&(!e.ctrlKey&&!e.metaKey||!e.shiftKey||"c"!==e.key&&"C"!==e.key&&67!==e.keyCode)&&(!e.ctrlKey&&!e.metaKey||"s"!==e.key&&"S"!==e.key&&83!==e.keyCode)?void 0:(e.preventDefault(),!1)})),setInterval((function(){const e=Date.now();(function(){}).constructor("debugger")(),Date.now()-e>100&&(document.body.innerHTML='<h2 style="color:red;text-align:center;margin-top:20%;">Developer Tools are restricted. Please close the console and reload.</h2>')}),1e3),setInterval(updateClock,1e3),updateClock(),window.addEventListener("DOMContentLoaded",(()=>{generateErrataRegister()}))</script></body></html>
