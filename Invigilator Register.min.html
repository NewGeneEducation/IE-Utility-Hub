<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Allotment of Invigilators Register - TGBIE</title><style>@page{size:A4 landscape;margin:6mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:15px;background-color:#eef2f5;color:#000}.no-print{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:25px}.manual-input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:#f1f8e9;padding:15px;border-radius:6px;border:1px solid #c8e6c9;margin-bottom:18px}.input-group{display:flex;flex-direction:column;text-align:left}.input-group label{font-size:11.5px;font-weight:700;color:#2e7d32;margin-bottom:4px}.input-group input,.input-group select{padding:6px 8px;font-size:12px;border:1px solid #a5d6a7;border-radius:4px;outline:0;background:#fff}.input-group input:focus,.input-group select:focus{border-color:#2e7d32;box-shadow:0 0 3px rgba(46,125,50,.3)}.controls-section{margin-top:15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}.btn{border:none;padding:10px 18px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;transition:opacity .2s;color:#fff}.btn:hover{opacity:.9}.btn-date{background-color:#0277bd}.btn-print{background-color:#2e7d32}.sheet-container{background:#fff;padding:15px;margin-bottom:25px;border-radius:4px;box-shadow:0 0 10px rgba(0,0,0,.08);page-break-after:always}.sheet-container:last-child{page-break-after:auto}.top-branding-bar{display:flex;justify-content:flex-end;align-items:center;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:8px;font-size:10px}.header-datetime{font-size:10px;color:#333;font-weight:600}.header-titles{text-align:center;margin-bottom:10px}.header-titles h2{margin:0;font-size:15px;text-transform:uppercase;font-weight:700}.header-titles h3{margin:2px 0;font-size:13px;font-weight:700}.header-titles h4{margin:2px 0;font-size:12px;text-decoration:underline}.details-grid{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px 12px;margin-bottom:8px;font-size:10.5px;font-weight:700}table{width:100%;border-collapse:collapse!important;text-align:center;border:1.5px solid #000!important;background-color:#fff;margin-bottom:10px;font-size:9.5px;table-layout:fixed}td,th{border:1px solid #000!important;padding:4px 2px;vertical-align:middle;color:#000;word-wrap:break-word;overflow-wrap:break-word}th{background-color:#f2f2f2!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}.col-num{font-size:8.5px;font-weight:700;background-color:#eaeaea!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.data-row td{height:27px}.left-text{text-align:left;padding-left:5px}.instructions{margin-top:8px;font-size:8.5px;border:1px dashed #555;padding:5px 8px;background-color:#fafafa;line-height:1.4}.instructions ol{margin:2px 0 0 14px;padding:0}.footer-signatures{margin-top:25px;display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px;font-weight:700}.footer-signatures div{text-align:center;flex:1}@media print{body{background-color:transparent;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none!important}.sheet-container{box-shadow:none;padding:0;margin:0}table{border:1.5px solid #000!important}td,th{border:1px solid #000!important}}</style></head><body><div class=no-print><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0d47a1;padding-bottom:6px;margin-bottom:12px"><h3 style=margin:0;color:#0d47a1>TGBIE &mdash; Allotment of Invigilators Register (Lottery Duty Chart)</h3><span id=live-clock style=font-size:12px;font-weight:700;color:#444></span></div><p style=font-size:12px;color:#555;margin-bottom:15px>Generate the official <strong>Allotment of Invigilators Register / Duty Chart</strong> to record room allocations finalized through the mandatory daily lottery system in the presence of the Departmental Officer.</p><div class=manual-input-grid><div class=input-group><label for=man-exam-type>Exam Type</label><select id=man-exam-type><option value=IPE>IPE (Annual)</option><option value=IPASE>IPASE (Advanced Supplementary)</option></select></div><div class=input-group><label for=man-exam-month-year>Exam Month &amp; Year</label><input id=man-exam-month-year placeholder="e.g., MARCH 2026"></div><div class=input-group><label for=man-centre-code>Centre Code</label><input id=man-centre-code placeholder="e.g., 44***"></div><div class=input-group><label for=man-college-name>Centre Name / College</label><input id=man-college-name placeholder="e.g., Govt. Junior College, ________"></div><div class=input-group><label for=man-dist-name>District</label><input id=man-dist-name placeholder="e.g., Bhadradri Kothagudem (44)"></div><div class=input-group><label for=man-exam-date>Date of Exam</label><input id=man-exam-date placeholder=DD/MM/YYYY></div><div class=input-group><label for=man-session-type>Session</label><select id=man-session-type><option value="Forenoon (9:00 AM - 12:00 PM)">Forenoon (9:00 AM - 12:00 PM)</option><option value="Afternoon (2:30 PM - 5:30 PM)">Afternoon (2:30 PM - 5:30 PM)</option></select></div><div class=input-group><label for=man-subject-day>Subject of the Day</label><input id=man-subject-day placeholder="e.g., Mathematics Paper-I / Botany-I"></div></div><div class=controls-section><button class="btn btn-date" onclick=generateDutyChart()>Generate Invigilators Register</button><button class="btn btn-print" onclick=window.print()>Print Register</button></div></div><div id=output-container></div><script>function updateClock(){const t=(new Date).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"medium"}),e=document.getElementById("live-clock");e&&(e.innerText=t)}function getFormattedTimestamp(){const t=new Date;return`${t.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})} | ${t.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:!0})}`}function getMetaInputs(){const t=document.getElementById("man-exam-type").value.trim(),e=document.getElementById("man-exam-month-year").value.trim(),n=document.getElementById("man-centre-code").value.trim(),o=document.getElementById("man-college-name").value.trim(),i=document.getElementById("man-dist-name").value.trim(),a=document.getElementById("man-session-type").value,s=document.getElementById("man-subject-day").value.trim();return{exam:`${t} ${e}`.trim(),centreCode:n||"______",collegeName:o||"________________________________________________",dist:i||"________________",session:a,subject:s||"____________________________________",timestamp:getFormattedTimestamp()}}function renderRegisterHtml(t,e){let n="";for(let t=1;t<=15;t++)n+=`\n            <tr class="data-row">\n                <td>${t}</td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n            </tr>`;const o=e.session.includes("Afternoon")?"1:30 PM":"8:00 AM",i=e.session.includes("Afternoon")?"1:50 PM":"8:20 AM";return`\n        <div class="sheet-container">\n            <div class="top-branding-bar">\n                <div class="header-datetime"><strong>Generated on:</strong> ${e.timestamp}</div>\n            </div>\n            <div class="header-titles">\n                <h2>Telangana Board of Intermediate Education, Hyderabad</h2>\n                <h3>${e.exam.toUpperCase()}</h3>\n                <h4>ALLOTMENT OF INVIGILATORS REGISTER (DAILY LOTTERY DUTY CHART)</h4>\n            </div>\n\n            <div class="details-grid">\n                <div><strong>Centre Code:</strong> ${e.centreCode}</div>\n                <div><strong>District:</strong> ${e.dist}</div>\n                <div><strong>Date of Exam:</strong> ${t||"____________________"}</div>\n                <div><strong>Session:</strong> ${e.session}</div>\n                <div style="grid-column: span 2;"><strong>Name of the Centre:</strong> ${e.collegeName}</div>\n                <div style="grid-column: span 2;"><strong>Subject(s) of the Day:</strong> ${e.subject}</div>\n            </div>\n\n            <table>\n                <colgroup>\n                    <col style="width: 3.5%;"> \x3c!-- Sl No --\x3e\n                    <col style="width: 17%;">  \x3c!-- Name of Invigilator --\x3e\n                    <col style="width: 11%;">  \x3c!-- Designation --\x3e\n                    <col style="width: 15%;">  \x3c!-- Institution --\x3e\n                    <col style="width: 10%;">  \x3c!-- Subject Handling --\x3e\n                    <col style="width: 5.5%;"> \x3c!-- Room No Allotted --\x3e\n                    <col style="width: 6.5%;"> \x3c!-- Candidates Allotted --\x3e\n                    <col style="width: 9.5%;"> \x3c!-- Reporting Time --\x3e\n                    <col style="width: 11%;">  \x3c!-- Invigilator Sig --\x3e\n                    <col style="width: 11%;">  \x3c!-- Remarks / Relief --\x3e\n                </colgroup>\n                <thead>\n                    <tr>\n                        <th>Sl.<br>No.</th>\n                        <th>Name of the Invigilator<br><span style="font-size:7.5px; font-weight:normal;">(Asst. Superintendent)</span></th>\n                        <th>Designation<br><span style="font-size:7.5px; font-weight:normal;">(JL / S.A. / Teacher)</span></th>\n                        <th>Parent College / School Name</th>\n                        <th>Subject Handled in College/School</th>\n                        <th>Room<br>No.<br>Allotted</th>\n                        <th>No. of<br>Candidates<br>Allotted</th>\n                        <th>Reporting Time &amp; Attendance</th>\n                        <th>Signature of the Invigilator</th>\n                        <th>Remarks / Reliever Details</th>\n                    </tr>\n                    <tr>\n                        <th class="col-num">(1)</th>\n                        <th class="col-num">(2)</th>\n                        <th class="col-num">(3)</th>\n                        <th class="col-num">(4)</th>\n                        <th class="col-num">(5)</th>\n                        <th class="col-num">(6)</th>\n                        <th class="col-num">(7)</th>\n                        <th class="col-num">(8)</th>\n                        <th class="col-num">(9)</th>\n                        <th class="col-num">(10)</th>\n                    </tr>\n                </thead>\n                <tbody>\n                    ${n}\n                </tbody>\n            </table>\n\n            <div class="instructions">\n                <strong>Important Instructions for Chief Superintendent &amp; Departmental Officer:</strong>\n                <ol>\n                    <li><strong>Daily Lottery Mandatory:</strong> Allotment of rooms to Invigilators / Assistant Superintendents must be conducted strictly through a <strong>daily lottery system at ${i}</strong> in the presence of the Departmental Officer.</li>\n                    <li><strong>Subject Handling Restriction:</strong> <strong>DO NOT POST</strong> any Junior Lecturer/Teacher handling the subject to invigilation duty on the day of examination in his/her subject.</li>\n                    <li><strong>Invigilation Ratio &amp; Norms:</strong> Appoint 1 Invigilator for every 20 candidates. Teachers from neighboring schools should not be drafted to an independent examination room as far as possible; when 2 invigilators are posted in a hall, one of them should be a school teacher.</li>\n                    <li><strong>Security &amp; ID Cards:</strong> All invigilators must wear visible Photo ID cards issued by DEC/HPC and must report by <strong>${o}</strong>. Mobile phones/electronic gadgets are strictly prohibited inside examination halls.</li>\n                </ol>\n            </div>\n\n            <div class="footer-signatures">\n                <div>Signature of the Departmental Officer (D.O.)</div>\n                <div>Signature of the Additional Chief Superintendent</div>\n                <div>Signature of the Chief Superintendent (C.S.)</div>\n            </div>\n        </div>`}function generateDutyChart(){const t=getMetaInputs(),e=document.getElementById("man-exam-date").value.trim();document.getElementById("output-container").innerHTML=renderRegisterHtml(e,t)}document.addEventListener("contextmenu",(t=>t.preventDefault())),document.addEventListener("keydown",(function(t){return"F12"===t.key||123===t.keyCode?(t.preventDefault(),!1):(!t.ctrlKey&&!t.metaKey||"u"!==t.key&&"U"!==t.key&&85!==t.keyCode)&&(!t.ctrlKey&&!t.metaKey||!t.shiftKey||"i"!==t.key&&"I"!==t.key&&73!==t.keyCode)&&(!t.ctrlKey&&!t.metaKey||!t.shiftKey||"j"!==t.key&&"J"!==t.key&&74!==t.keyCode)&&(!t.ctrlKey&&!t.metaKey||!t.shiftKey||"c"!==t.key&&"C"!==t.key&&67!==t.keyCode)&&(!t.ctrlKey&&!t.metaKey||"s"!==t.key&&"S"!==t.key&&83!==t.keyCode)?void 0:(t.preventDefault(),!1)})),setInterval((function(){const t=Date.now();(function(){}).constructor("debugger")(),Date.now()-t>100&&(document.body.innerHTML='<h2 style="color:red;text-align:center;margin-top:20%;">Developer Tools are restricted. Please close the console and reload.</h2>')}),1e3),setInterval(updateClock,1e3),updateClock(),window.addEventListener("DOMContentLoaded",(()=>{generateDutyChart()}))</script></body></html>
